name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: lint
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Unit tests with coverage
        run: pytest tests/test_health_check.py tests/test_entrypoint.py --cov=. --cov-report=xml

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.1.0

  build-and-test-amd64:
    name: Build and test (amd64)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Docker image for testing (amd64)
        run: |
          docker buildx build \
            --target test \
            --platform linux/amd64 \
            --tag cs-image-tools:${{ github.sha }}-amd64-test \
            --output type=docker \
            .

      - name: Run tests (amd64)
        run: docker run --rm cs-image-tools:${{ github.sha }}-amd64-test

  release-multi-arch-build-and-push:
    name: Release multi-arch build and push
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: build-and-test-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ahuservices
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push multi-arch Docker image (amd64 + arm64)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ahuservices/cs-image-tools:latest \
            --tag ahuservices/cs-image-tools:${{ github.ref_name }} \
            --push \
            .
